# SPDX-License-Identifier: GPL-2.0
#
# The release gate (TODO P0-1, P0-2): every push and pull request runs
# ci/build-gate.sh on a clean checkout, against the installer's default kernel
# (verified against kernel.org's signature before it is unpacked) and the
# runner's installed headers. A release is made only from a passing run; the
# gate record is kept as an artifact.
#
# Two VM jobs run weekly and on demand, only after the gate passes, and need
# KVM. Together they take about two hours of runner time, so not nightly.
# kernel-boot builds the installer's default kernel with secure_sudo built in
# and runs the in-kernel tests (tests/vm/ss-functest.c) as PID 1 of a
# throwaway guest. distro-vm (install/rollback/removal/recovery, then the
# STIG release gate on a fresh guest) takes about an hour.
name: build-gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vm:
        description: "VM jobs to run after the gate"
        type: choice
        options: [all, kernel-boot, distro-vm]
        default: all
  schedule:
    - cron: "17 3 * * *"   # the gate, nightly
    - cron: "17 5 * * 0"   # the gate and the VM jobs, weekly (Sunday)

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            libpam0g-dev libqrencode-dev zlib1g-dev libcrypt-dev shellcheck python3 \
            gnupg xz-utils curl nftables iproute2 netcat-openbsd zip unzip \
            swtpm swtpm-tools tpm2-tools libtss2-tcti-swtpm0t64 libtss2-dev "linux-headers-$(uname -r)"

      - name: Fetch and verify the installer's default kernel
        run: |
          kver=$(sed -n 's/^KVER="${KVER:-\([0-9.]*\)}".*/\1/p' install/install.sh)
          mkdir -p "$RUNNER_TEMP/k" && cd "$RUNNER_TEMP/k"
          curl -fLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$kver.tar.xz"
          curl -fLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$kver.tar.sign"
          bash "$GITHUB_WORKSPACE/scripts/verify-kernel-source.sh" --fetch-missing \
            --keys "$GITHUB_WORKSPACE/install/keys" --metadata kernel-source.txt \
            "linux-$kver.tar.xz" "linux-$kver.tar.sign"
          tar -xf "linux-$kver.tar.xz"
          echo "KTREE=$RUNNER_TEMP/k/linux-$kver" >> "$GITHUB_ENV"

      - name: Build gate
        run: |
          # SS_REQUIRE_SWTPM: the OTP tests must seal to a software TPM
          # here (gap G3), not skip.
          sudo SS_REQUIRE_SWTPM=1 bash ci/build-gate.sh --kernel-tree "$KTREE" \
            --headers "/usr/src/linux-headers-$(uname -r)" \
            --record "$RUNNER_TEMP/build-gate-record.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-gate-record
          path: |
            ${{ runner.temp }}/build-gate-record.txt
            ${{ runner.temp }}/k/kernel-source.txt

  kernel-boot:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.vm != 'distro-vm')
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev \
            busybox-static qemu-system-x86 cpio gzip file gnupg xz-utils curl swtpm
          sudo chmod 666 /dev/kvm || true

      - name: Fetch and verify the installer's default kernel
        run: |
          kver=$(sed -n 's/^KVER="${KVER:-\([0-9.]*\)}".*/\1/p' install/install.sh)
          mkdir -p "$RUNNER_TEMP/k" && cd "$RUNNER_TEMP/k"
          curl -fLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$kver.tar.xz"
          curl -fLO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$kver.tar.sign"
          bash "$GITHUB_WORKSPACE/scripts/verify-kernel-source.sh" --fetch-missing \
            --keys "$GITHUB_WORKSPACE/install/keys" --metadata kernel-source.txt \
            "linux-$kver.tar.xz" "linux-$kver.tar.sign"
          tar -xf "linux-$kver.tar.xz"
          echo "KTREE=$RUNNER_TEMP/k/linux-$kver" >> "$GITHUB_ENV"

      - name: Build the test kernel (secure_sudo built in)
        run: bash tests/vm/build-test-kernel.sh "$KTREE" "$RUNNER_TEMP/kout"

      - name: Boot it and run the in-kernel tests
        run: bash tests/vm/boot-test.sh "$RUNNER_TEMP/kout" "$RUNNER_TEMP/res-boot"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-boot-results
          path: |
            ${{ runner.temp }}/res-boot
            ${{ runner.temp }}/k/kernel-source.txt

  distro-vm:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.vm != 'kernel-boot')
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the kernel build
        run: |
          # install.sh build-kernel wants ~20 GB; the runner image leaves
          # ~12 GB. Drop preinstalled SDKs this job never uses.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client \
            build-essential bc bison flex libelf-dev libssl-dev libpam0g-dev libqrencode-dev \
            zlib1g-dev libcrypt-dev debhelper rsync kmod cpio zstd gnupg xz-utils curl python3 \
            swtpm swtpm-tools
          sudo chmod 666 /dev/kvm || true

      - name: Verified Ubuntu 24.04 cloud image
        run: |
          mkdir -p "$RUNNER_TEMP/img" && cd "$RUNNER_TEMP/img"
          curl -fLO https://cloud-images.ubuntu.com/noble/current/SHA256SUMS
          curl -fLO https://cloud-images.ubuntu.com/noble/current/SHA256SUMS.gpg
          gpgv --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg SHA256SUMS.gpg SHA256SUMS
          curl -fLO https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Kernel package via install.sh build-kernel
        run: |
          # The guest's config and module list, from one throwaway boot.
          W="$RUNNER_TEMP/probe"
          bash tests/vm/distro/vm.sh up "$W" "$RUNNER_TEMP/img/noble-server-cloudimg-amd64.img"
          bash tests/vm/distro/vm.sh ssh "$W" 'lsmod > /root/lsmod.txt'
          bash tests/vm/distro/vm.sh get "$W" "/boot/config-*" "$RUNNER_TEMP/base.config"
          bash tests/vm/distro/vm.sh get "$W" /root/lsmod.txt "$RUNNER_TEMP/lsmod.txt"
          bash tests/vm/distro/vm.sh down "$W"
          sudo env BUILD_ROOT="$RUNNER_TEMP/ssbuild" SS_BASE_CONFIG="$RUNNER_TEMP/base.config" \
            SS_LOCALMOD="$RUNNER_TEMP/lsmod.txt" bash install/install.sh build-kernel

      - name: Locate the kernel package
        run: |
          # install.sh keeps BUILD_ROOT root-only (0700), so look as root.
          out=$(sudo find "$RUNNER_TEMP/ssbuild/out" -mindepth 1 -maxdepth 1 -type d -print -quit)
          [ -n "$out" ] || { echo "install.sh build-kernel left no output directory"; exit 1; }
          sudo ls -l "$out"
          echo "KOUT=$out" >> "$GITHUB_ENV"

      - name: Install, trial boot, fallback, commit, recovery drills, rollback, removal
        run: |
          # VM_TPM=1: the guest gets a software TPM for the G3 steps.
          sudo VM_TPM=1 bash tests/vm/distro/run-install-test.sh \
            "$RUNNER_TEMP/img/noble-server-cloudimg-amd64.img" "$KOUT" "$RUNNER_TEMP/res-install"

      - name: STIG release gate in the VM (allowed results in tests/oscap/ubuntu2404-stig.expect)
        run: |
          # The SSG content the gate is pinned to (docs/OSCAP_BUGS.md); the
          # datastream must match the recorded hash.
          cd "$RUNNER_TEMP"
          curl -fLO https://github.com/ComplianceAsCode/content/releases/download/v0.1.78/scap-security-guide-0.1.78.zip
          unzip -q scap-security-guide-0.1.78.zip
          ds="$RUNNER_TEMP/scap-security-guide-0.1.78/ssg-ubuntu2404-ds.xml"
          echo "8ec037c7f1f8484eed419172054a9e5acd611a5aa480c2ec18090344363c36ac  $ds" | sha256sum -c
          cd "$GITHUB_WORKSPACE"
          sudo bash tests/vm/distro/run-stig-test.sh \
            "$RUNNER_TEMP/img/noble-server-cloudimg-amd64.img" "$KOUT" "$ds" "$RUNNER_TEMP/res-stig"

      - name: Add-on units under real systemd (P2-2 hardening, limits, failure reporting)
        run: |
          sudo bash tests/vm/distro/run-addon-units-test.sh \
            "$RUNNER_TEMP/img/noble-server-cloudimg-amd64.img" "$RUNNER_TEMP/res-addons"

      - name: Make the results readable for upload (never the VM key or disk)
        if: always()
        run: |
          for d in "$RUNNER_TEMP/res-install" "$RUNNER_TEMP/res-stig" "$RUNNER_TEMP/res-addons"; do
            sudo test -d "$d" || continue
            sudo find "$d" \( -name 'id_vm*' -o -name '*.qcow2' \) -print -delete
            sudo chown -R "$(id -u):$(id -g)" "$d"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distro-vm-results
          path: |
            ${{ runner.temp }}/res-install
            ${{ runner.temp }}/res-stig
            ${{ runner.temp }}/res-addons
