# secure_sudo configuration - loaded into the kernel by `secure-sudo load`.
# Lines are key = value. '#' starts a comment. Keys the kernel doesn't know
# (retain_days, max_total_mb, vault_action) are read by the secure-sudod daemon.

# --- privilege model (#1) ---
# GIDs whose members count as "sudo users" (in addition to root), comma-
# separated. install.sh fills this in automatically by detecting every admin
# group on the box (sudo, wheel, admin, and any %group in sudoers). Re-run
# `sudo secure-sudo detect-admins` after adding an admin group. "unset" = root only.
admin_gid = unset
block_setid = 1
block_userns = 1

# #1b: also block non-sudo users from executing setuid/setgid/file-cap programs
# (su, pkexec, ...) unless listed in setid_exec_allow.conf. Off by default
# because it needs that allowlist populated first.
block_setid_exec = 0

# --- firmware / flash (#3) ---
block_flash = 1

# --- RAM-spike -> drop caches (#7) ---
ram_spike_enabled = 0
max_ram_percent = 90
check_interval_ms = 5000
drop_cooldown_ms = 2000

# --- exec from scratch dirs (#12) ---
block_tmp_exec = 1
# Also block exec/PROT_EXEC from ANY tmpfs/ramfs (incl. /run/user, memfd):
block_tmpfs_exec = 0

# --- home write-restriction (#4): confine non-sudo writes to home + allowlist.
# Aggressive; off by default. home_map.conf (uid -> home) is generated from
# /etc/passwd by the installer; home_write_allow.conf adds extra prefixes. ---
block_home_write = 0

# --- network mode (#10): monitor | host | lan-only | public-only ---
net_mode = monitor

# --- sudo brute-force cooldown (#8) ---
sudo_cooldown_enabled = 1
sudo_max_fails = 5
sudo_window_sec = 60
sudo_block_time_sec = 300

# --- daemon-only keys (logging/retention #9, TimeVault #13) ---
# retain_days = 14
# max_total_mb = 512
# --- TimeVault (#13) extra kernel knob ---
# Also require PROT_EXEC mmaps (shared libraries) to be on the allowlist while
# the vault is engaged. Off by default; turning it on needs /usr/lib* listed.
timevault_strict_mmap = 0

# --- config lock (#16) ---
# When the lock engages, also refuse ALL kernel module loads until reboot
# (not just blacklisted ones). 1 = yes.
lock_modules = 1

# Comments go on their own line: a '#' after a value is part of the value.
#
# Remote events can use legacy UDP or authenticated RFC 5425 TLS. TLS validates
# the collector name/IP against this CA bundle; its default is the system CA
# bundle. TLS queues unsent events privately under /var/lib/secure_sudo, oldest
# first, up to 10 MiB or 4096 event files by default; queue exhaustion drops
# the newest event and is reported by `secure-sudo health`. TCP/TLS write
# success is not proof that the collector stored the event.
# remote_syslog = collector.example:6514
# (udp | tls; default: udp)
# remote_syslog_transport = tls
# remote_syslog_ca_file = /etc/ssl/certs/ca-certificates.crt
# (1..1024 MiB; TLS also caps at 4096 files)
# remote_queue_max_mb = 10
# (quarantine | wipe)
# vault_action = quarantine

# Alerts (P2-3, docs/EVENTS.md). Every record gets a severity (info, low,
# medium, high, critical) from its typed fields; it sets the forwarded syslog
# priority, and records at alert_min_severity or above run alert_cmd. The
# command runs WITHOUT a shell (quotes group words; pipes and $VARS do not
# work, point it at a script), with placeholders %s severity, %t event type,
# %d decision, %r reason, %o object, %u target UID, %m message, %j the whole
# JSON record, %h host name, %n alerts held back as duplicates, %% a %.
# Duplicates (same type, operation, decision, reason, object and UID) within
# alert_dedup_seconds are counted, not run; at most alert_max_per_minute run
# a minute; a command still running after alert_timeout_seconds is killed.
# Failures are alert_failed records and make `secure-sudo health` degraded.
# alert_cmd = /usr/local/sbin/page-oncall %s %t "%m"
# (info | low | medium | high | critical)
# alert_min_severity = high
# (0..86400)
# alert_dedup_seconds = 300
# (1..600)
# alert_max_per_minute = 10
# (1..300)
# alert_timeout_seconds = 10

# Node child guard (#11): the daemon runs `secure-sudo node-scan` at start and
# every node_sea_scan_interval minutes (0 = off) to register single-executable
# apps, pkg builds and renamed node binaries found under these directories.
# node_sea_scan_dirs = /opt,/usr/local/bin,/usr/local/sbin,/usr/local/lib,/srv
# node_sea_scan_interval = 60

# --- BinaryVault (#17) ---
# Freeze every executable and shared library on the machine: once on (which
# `secure-sudo load` makes effective at every boot) no write, truncate,
# delete, rename-over, chmod or xattr change to a binary is allowed for ANYONE,
# root included. This is the anti-tamper / anti-persistence control: an
# attacker cannot make malicious code survive a reboot because they can never
# write it to disk. Off (0) by default; turn on once you have reviewed the
# update procedure below. 1 = freeze binaries.
binaryvault = 0
# To update packages on a vault-locked box you must reboot into a maintenance
# window: add  secure_sudo.binvault_maint=1  to the kernel command line (a GRUB
# one-shot is ideal), run your package upgrade, then reboot normally. There is
# deliberately NO runtime way to open the vault - that is what makes it an
# anti-tamper control. `secure-sudo status` shows binvault_maint=1 during such
# a boot. Directories holding genuinely self-updating software go in
# binvault_allow.conf instead.

# --- RadioGuard (#19): wireless lockdown / Ethernet-only ---
# Turn the machine's radios off and keep them off, for a wired-only box.
# 1 = radio BLOCKED (off), 0 = allowed. Enforced in-kernel three ways: the
# driver stack's core module is refused at load, AF_BLUETOOTH sockets are
# denied, and writes to /dev/rfkill are denied (so a blocked radio cannot be
# un-blocked). Easiest to drive with `secure-sudo radio ...` (see COMMANDS.md).
block_wifi = 0
block_bluetooth = 0
# Master switch: when 1, BOTH Wi-Fi and Bluetooth are blocked regardless of the
# two keys above. This is the one-line "Ethernet only" setting.
ethernet_only = 0

# --- TimeVault (#13) auto-update + size ---
# Honour auto-update whitelist entries (lines ending in "auto" or "autodir",
# which skip hash validation). 1 = honour them. Set 0 to DISABLE auto-update
# apps: every auto-update entry is then refused at exec (there is no hash to
# fall back to), while normal hash-checked entries keep working.
timevault_allow_autoupdate = 1
# Maximum number of entries the whitelist may hold (1..131072). Takes effect on
# the next allowlist write. Lower it to bound memory on small systems.
timevault_max_entries = 16384

# --- Process Runtime Guard (#20) ---
# Memory-tamper guard for ALL processes except those whose executable is listed
# in prguard_allow.conf. When on, denies cross-process memory tampering
# (ptrace attach, process_vm_writev, /proc/pid/mem writes) and W^X mappings
# (pages that are writable and executable at once). 1 = on. Opt-in.
prguard_enabled = 0
# Verbose memory-access feed: one event per cross-process memory read/write
# (source -> target), shown on the GUI's Memory access tab. Opt-in, chatty.
prguard_observe = 0

# --- BPF & perf guard (#22) ---
# Deny bpf(2) to non-sudo users (on top of kernel.unprivileged_bpf_disabled,
# which root can flip back; this cannot be flipped once the lock latches).
bpf_guard = 1
# Once the #16 lock latches, refuse tracing-class BPF programs (kprobe,
# tracepoint, perf_event, fentry/fexit, BPF-LSM, freplace) for EVERY user,
# root included. Networking/cgroup BPF (systemd, firewalls) is unaffected.
bpf_lock_tracing = 1
# Deny perf_event_open(2) to non-sudo users.
perf_guard = 1

# --- SysctlGuard (#23) ---
# Freeze the security-critical sysctls (kptr_restrict, dmesg_restrict,
# ptrace_scope, core_pattern, modprobe, randomize_va_space, fs.protected_*,
# unprivileged_bpf_disabled, ...) and binfmt_misc registration: write-opens are
# refused for EVERY user, root included, while this is on. systemd-sysctl
# applies your sysctl.d values first at boot; `secure-sudo load` then engages
# this. To retune a value: set this to 0, change it, set it back to 1 (not
# possible once the #16 lock has latched - that is the point).
sysctl_guard = 1

# --- Audit feed (#9) ---
# Also send every secure_sudo kernel event to the kernel audit subsystem
# (auditd / ausearch -m KERNEL_OTHER / SIEM), in addition to the daemon's
# dated logs. Needs CONFIG_AUDIT (on in every distro kernel).
audit_events = 1

# --- Lock: confidentiality class (#16) ---
# While locked, ALSO refuse kernel-memory reads: /proc/kcore, kprobes,
# bpf_probe_read_kernel, perf and tracefs kernel reads. Opt-in, because it also
# stops legitimate kernel tracing/profiling tools (perf, bpftrace).
lock_confidentiality = 0
