# secure_sudo configuration - loaded into the kernel by `secure-sudo load`.
# Lines are key = value. '#' starts a comment. Keys the kernel doesn't know
# (retain_days, max_total_mb, vault_action) are read by the secure-sudod daemon.

# --- privilege model (#1) ---
# GIDs whose members count as "sudo users" (in addition to root), comma-
# separated. install.sh fills this in automatically by detecting every admin
# group on the box (sudo, wheel, admin, and any %group in sudoers). Re-run
# `sudo secure-sudo detect-admins` after adding an admin group. "unset" = root only.
admin_gid = unset
block_setid = 1
block_userns = 1

# #1b: also block non-sudo users from executing setuid/setgid/file-cap programs
# (su, pkexec, ...) unless listed in setid_exec_allow.conf. Off by default
# because it needs that allowlist populated first.
block_setid_exec = 0

# --- firmware / flash (#3) ---
block_flash = 1

# --- RAM-spike -> drop caches (#7) ---
ram_spike_enabled = 0
max_ram_percent = 90
check_interval_ms = 5000
drop_cooldown_ms = 2000

# --- exec from scratch dirs (#12) ---
block_tmp_exec = 1
# Also block exec/PROT_EXEC from ANY tmpfs/ramfs (incl. /run/user, memfd):
block_tmpfs_exec = 0

# --- home write-restriction (#4): confine non-sudo writes to home + allowlist.
# Aggressive; off by default. home_map.conf (uid -> home) is generated from
# /etc/passwd by the installer; home_write_allow.conf adds extra prefixes. ---
block_home_write = 0

# --- network mode (#10): monitor | host | lan-only | public-only ---
net_mode = monitor

# --- sudo brute-force cooldown (#8) ---
sudo_cooldown_enabled = 1
sudo_max_fails = 5
sudo_window_sec = 60
sudo_block_time_sec = 300

# --- daemon-only keys (logging/retention #9, TimeVault #13) ---
# retain_days = 14
# max_total_mb = 512
# --- TimeVault (#13) extra kernel knob ---
# Also require PROT_EXEC mmaps (shared libraries) to be on the allowlist while
# the vault is engaged. Off by default; turning it on needs /usr/lib* listed.
timevault_strict_mmap = 0

# --- config lock (#16) ---
# When the lock engages, also refuse ALL kernel module loads until reboot
# (not just blacklisted ones). 1 = yes.
lock_modules = 1

# remote_syslog =            # host:port to forward events to (TimeVault needs this)
# vault_action = quarantine  # quarantine | wipe

# --- BinaryVault (#17) ---
# Freeze every executable and shared library on the machine: once on (which
# `secure-sudo load` makes effective at every boot) no write, truncate,
# delete, rename-over, chmod or xattr change to a binary is allowed for ANYONE,
# root included. This is the anti-tamper / anti-persistence control: an
# attacker cannot make malicious code survive a reboot because they can never
# write it to disk. Off (0) by default; turn on once you have reviewed the
# update procedure below. 1 = freeze binaries.
binaryvault = 0
# To update packages on a vault-locked box you must reboot into a maintenance
# window: add  secure_sudo.binvault_maint=1  to the kernel command line (a GRUB
# one-shot is ideal), run your package upgrade, then reboot normally. There is
# deliberately NO runtime way to open the vault - that is what makes it an
# anti-tamper control. `secure-sudo status` shows binvault_maint=1 during such
# a boot. Directories holding genuinely self-updating software go in
# binvault_allow.conf instead.

# --- RadioGuard (#19): wireless lockdown / Ethernet-only ---
# Turn the machine's radios off and keep them off, for a wired-only box.
# 1 = radio BLOCKED (off), 0 = allowed. Enforced in-kernel three ways: the
# driver stack's core module is refused at load, AF_BLUETOOTH sockets are
# denied, and writes to /dev/rfkill are denied (so a blocked radio cannot be
# un-blocked). Easiest to drive with `secure-sudo radio ...` (see COMMANDS.md).
block_wifi = 0
block_bluetooth = 0
# Master switch: when 1, BOTH Wi-Fi and Bluetooth are blocked regardless of the
# two keys above. This is the one-line "Ethernet only" setting.
ethernet_only = 0
