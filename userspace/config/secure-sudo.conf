# secure_sudo configuration - loaded into the kernel by `secure-sudo load`.
# Lines are key = value. '#' starts a comment. Keys the kernel doesn't know
# (retain_days, max_total_mb, vault_action) are read by the secure-sudod daemon.

# --- privilege model (#1) ---
# GIDs whose members count as "sudo users" (in addition to root), comma-
# separated. install.sh fills this in automatically by detecting every admin
# group on the box (sudo, wheel, admin, and any %group in sudoers). Re-run
# `sudo secure-sudo detect-admins` after adding an admin group. "unset" = root only.
admin_gid = unset
block_setid = 1
block_userns = 1

# --- firmware / flash (#3) ---
block_flash = 1

# --- RAM-spike -> drop caches (#7) ---
ram_spike_enabled = 0
max_ram_percent = 90
check_interval_ms = 5000
drop_cooldown_ms = 2000

# --- exec from scratch dirs (#12) ---
block_tmp_exec = 1

# --- home write-restriction (#4): confine non-sudo writes to home + allowlist.
# Aggressive; off by default. home_map.conf (uid -> home) is generated from
# /etc/passwd by the installer; home_write_allow.conf adds extra prefixes. ---
block_home_write = 0

# --- network mode (#10): monitor | host | lan-only | public-only ---
net_mode = monitor

# --- sudo brute-force cooldown (#8) ---
sudo_cooldown_enabled = 1
sudo_max_fails = 5
sudo_window_sec = 60
sudo_block_time_sec = 300

# --- daemon-only keys (logging/retention #9, TimeVault #13) ---
