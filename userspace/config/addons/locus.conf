# Locus (runtime guard) - the rotating-location allocator.
#
# Allocator request point (the LAN access point). Keep on 127.0.0.1 unless
# other hosts must request locations; then set to a LAN IP of this machine.
alloc_bind = 127.0.0.1
alloc_port = 8787

# Read-only status GUI (HTTP). Keep on 127.0.0.1 unless you deliberately expose
# it; it only DISPLAYS locations (GET, no inputs, no file serving).
gui_bind = 127.0.0.1
gui_port = 8788

# The main root directories to use, one per purpose. The location handed out is
# this hour's bucket under the matching root (rotates hourly).
root procguard-quarantine = /var/lib/secure_sudo/addons/procguard/quarantine
root driverguard-backup   = /var/lib/secure_sudo/addons/driverguard/backups
root bootguard-backup     = /var/lib/secure_sudo/addons/bootguard/backups

# Root for any purpose not listed above (optional).
default_root = /var/lib/secure_sudo/addons/locus/alloc
