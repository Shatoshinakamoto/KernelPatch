# ProcGuard allowlist - absolute paths of executables allowed to run.
# One path per line; '#' comments. ProcGuard refuses to run if this is empty
# (an empty list would mean "kill everything"). PID 1, kernel threads, your own
# shell's process tree, and the secure_sudo binaries are always exempt.
#
# Populate this in monitor mode first (watch the log for "would kill" lines and
# add the paths you actually need), then switch mode to enforce.
#
# Typical base set (uncomment/adjust for your distro):
#/usr/lib/systemd/systemd
#/usr/sbin/sshd
#/usr/bin/bash
#/usr/bin/dash
#/usr/bin/login
