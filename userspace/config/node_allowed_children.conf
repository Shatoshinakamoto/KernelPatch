# NodeJS child guard (#11): programs that node/SEA processes may exec as
# children. Anything a node process tries to spawn that is not listed here
# (and is not node itself) is denied. One entry per line:
#   /usr/bin/git   an absolute path matches that resolved file exactly (stricter)
#   git            a bare name matches the basename: ANY file called git
# Prefer absolute paths. See docs/files/node_allowed_children.md.
#
#/usr/bin/sh
#/usr/bin/git
#npm
