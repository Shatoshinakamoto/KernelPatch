# /etc/secure_sudo/net.conf - how the net_mode rules (lan-only, public-only)
# decide what "the LAN" is, and what happens when the daemon stops.
# Read by /usr/libexec/secure-sudo/apply-net.sh, which secure-sudod runs when
# net_mode changes and every 15 seconds after (so DHCP and interface changes
# are picked up). See docs/CONFIGURATION.md#net_mode.

# Which interfaces are the LAN. auto: every interface with a global address
# except loopback, VPN interfaces (below) and bridges that do not carry a
# default route (docker0, virbr0: those are "local", reachable in both
# modes). Or name them: lan_interfaces = eth0 wlan0
lan_interfaces = auto

# Never LAN, whatever lan_interfaces says (shell patterns). Any link that is
# not Ethernet/Wi-Fi/InfiniBand (WireGuard, tun, ppp, GRE) is a VPN too.
vpn_interfaces = wg* tun* tap* ppp* tailscale* zt* nordlynx* ipsec* vti* utun*

# More LAN subnets (IPv4 or IPv6 CIDRs), e.g. a routed office network that
# is not on any local interface: extra_lan = 10.20.0.0/16 2001:db8:aa::/48
extra_lan =

# 1: filter traffic this host FORWARDS too, so containers and network
# namespaces routed through it follow the mode. 0: only this host's own.
forward = 1

# When secure-sudod stops cleanly: keep (default) leaves the rules loaded, so
# stopping or killing the daemon never opens the network; remove deletes
# them. A crash always keeps them. To lift the rules by hand:
# `secure-sudo net monitor`.
on_stop = keep
