# PheonixBox (#21) - protected paths.
#
# One absolute path per line. A path may be a single file or a directory;
# a directory is protected recursively (every regular file beneath it).
# Lines starting with '#', blank lines, and relative paths are ignored.
# Paths containing spaces or tabs are skipped (the manifest is line-based).
#
# When PheonixBox is enabled (`secure-sudo pheonixbox on`) every file listed
# here is snapshotted (SHA-256 manifest + compressed original bytes), its
# owner/group/mode and POSIX ACLs are captured, and the file is made
# read-only. The daemon then scans on a timer and restores any file whose
# contents change or that is deleted, straight from the snapshot store.
#
# Disabling (`secure-sudo pheonixbox off`) restores every file's original
# permissions from that capture. Edit this list with `secure-sudo pheonixbox
# add <path>` / `remove <path>`, or by hand; re-run `pheonixbox snapshot`
# (while disabled) for edits to take effect.
#
# Examples (uncomment and adjust):
#/etc/ssh/sshd_config
#/usr/local/bin
#/opt/myapp/bin
