# Process Runtime Guard (#20) exemption list.
#
# Absolute path, one per line, of PROGRAMS that are EXEMPT from the runtime
# memory guard - the few that legitimately need to inspect or rewrite process
# memory or need writable+executable pages: debuggers, profilers, and some
# JIT runtimes. A process is matched by the path of its main executable.
#
# Keep this list minimal: each entry is a program allowed to ptrace other
# processes and map W+X memory. Manage it with `secure-sudo prguard add|remove`.
#
# Examples:
# /usr/bin/gdb
# /usr/bin/strace
# /usr/bin/perf
