# TPM device guard (#5, gap G4): programs that may open /dev/tpm0 or
# /dev/tpmrm0 once the config lock (#16) is engaged.
#
# An LSM cannot read the commands sent to the TPM, so it cannot tell
# TPM2_Clear from an unseal. Instead, while locked, every other program -
# root's tpm2_clear included - is refused the device. A program is matched
# by the absolute path of its main executable, which must be owned by root
# and not group/world-writable. The list is frozen while locked; the
# secure_sudo.tpm_maint=1 boot lifts the guard for a maintenance window.
#
# These are the kernel's defaults: the systemd TPM helpers (systemd-creds
# unseals the OTP master key, G3), disk unlocking, and secure-sudo-attest
# (P2-1: it can only read PCRs and sign quotes with its own restricted key).
#
# Not in the defaults, on purpose: /usr/lib/systemd/systemd-pcrextend and
# /usr/sbin/tpm2-abrmd. Either lets root extend any PCR, so once locked root
# could forge events in the kernel's policy measurement and remote
# attestation could no longer prove the policy (docs/ATTESTATION.md).
# Add them back only if you need them after the lock (measured-UKI boots
# run systemd-pcrextend at shutdown; tpm2-tools users go through abrmd),
# and enroll such hosts with --accept-pcr-extenders. Add your own TPM users (for example clevis's tpm2 pin, which runs
# tpm2-tools) here, then `secure-sudo load` before locking.
/usr/bin/systemd-creds
/usr/bin/systemd-cryptenroll
/usr/lib/systemd/systemd-cryptsetup
/usr/lib/systemd/systemd-pcrlock
/usr/lib/systemd/systemd-tpm2-setup
/usr/lib/systemd/systemd-measure
/usr/libexec/secure-sudo/secure-sudo-attest
