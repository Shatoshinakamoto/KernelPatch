# Command blacklist (#2): absolute paths non-sudo users may not execute.
# Matched by (device, inode) and canonical path, so renaming the binary or
# dropping a replacement at the same path is still caught. One path per line.
#
# Examples (uncomment to use):
#/usr/bin/nc
#/usr/bin/ncat
#/usr/bin/tcpdump
#/usr/sbin/tcpdump
