# setid-exec allowlist (#1b). When block_setid_exec = 1, a non-sudo user may
# only execute a setuid/setgid or file-capability program (one that would give
# them a new identity or capability) if its resolved absolute path is listed
# here. Everything else - su, newgrp, pkexec, mount, ... - is denied to
# non-sudo users. Sudo users are unaffected.
#
# List the few privilege-gaining helpers ordinary users genuinely need. A
# minimal, safe starting set (uncomment what applies to your distro):
#
#/usr/bin/passwd
#/usr/bin/sudo
#/usr/bin/doas
# One absolute path per line.
