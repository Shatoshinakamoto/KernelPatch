# TimeVault exec allowlist (#13). When the vault is engaged, ONLY these
# programs may run; everything else is denied and counted. Package managers
# (apt, dpkg, dnf, yum, rpm, zypper, pacman, snap, flatpak) are always denied,
# even if listed here.
#
# Each line is an absolute path, optionally followed by a SHA-256 to pin the
# exact contents (a tampered binary at an allowed path is then still denied):
#   /usr/bin/bash
#   /usr/bin/sshd 9f2b...<64 hex>
#
# Build this list BEFORE engaging the vault - once engaged the config locks.
#/usr/bin/bash
#/bin/sh
#/usr/sbin/sshd
