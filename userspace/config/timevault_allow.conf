# TimeVault exec allowlist (#13). When the vault is engaged, ONLY these
# programs may run; everything else is denied and counted. Package managers
# (apt, dpkg, dnf, yum, rpm, zypper, pacman, snap, flatpak) are always denied,
# even if listed here.
#
# Each entry pins what may run. One per line:
#   /usr/bin/bash 9f2b...<64-hex SHA-256>   hash-checked: the file's bytes must match
#   /opt/app/bin/app auto                   auto-update file: runs without a hash check
#   /opt/app/bin autodir                    auto-update directory (prefix, no hash check)
# A bare path is refused: a path alone could be satisfied by another file in
# another mount namespace or by a binary swapped in place. One bad line makes
# the kernel refuse the WHOLE list, and `secure-sudo lint` reports it first.
# auto/autodir entries are refused at exec when timevault_allow_autoupdate = 0.
#
# Do not write hashes by hand: `secure-sudo vault-allow scan DIR...`,
# `vault-allow add FILE...`, `add-auto` and `add-autodir` compute and add them.
# Build this list BEFORE engaging the vault - once engaged the config locks.
# See docs/files/timevault_allow.md.
