# BinaryVault (#17) allowlist - directory prefixes EXEMPT from the vault.
#
# One absolute directory path per line; '#' starts a comment. Any binary under
# a listed prefix may still be written/updated while BinaryVault is engaged.
# Use this ONLY for software that legitimately rewrites its own binaries at
# runtime (some browsers under /opt, certain self-updating agents). Every entry
# is a hole in the anti-tamper guarantee, so keep this list as small as you can
# and prefer the maintenance-reboot procedure for normal package updates.
#
# Example:
# /opt/google/chrome
