// secure_sudo add-ons: re-baseline BootGuard/DriverGuard after every apt run,
// so a kernel, initramfs or GRUB update is not rolled back as tampering.
DPkg::Post-Invoke { "if [ -x /usr/libexec/secure-sudo/addons-refresh ]; then /usr/libexec/secure-sudo/addons-refresh apt-transaction; fi"; };
