# ProcGuard (v8 add-on) configuration.
#
# mode: start in `monitor` and verify the allowlist catches nothing you need,
# THEN switch to `enforce`. In monitor mode nothing is killed or removed.
mode = monitor

# how often the daemon rescans /proc, in seconds.
interval = 5

# A non-allowed executable that keeps coming back is treated as an infection
# after this many kills within this many seconds.
respawn_threshold = 3
respawn_window = 60

# When an infection is confirmed: remove the on-disk file (1) or leave it (0).
# The compressed sample is quarantined either way.
remove_on_infection = 1

# Fallback quarantine root if Locus is not configured/reachable. The real path
# used is this hour's bucket under here (rotates hourly).
quarantine_root = /var/lib/secure_sudo/addons/procguard/quarantine

# Optional: ship each quarantined (compressed) sample off-box for analysis.
# %f is replaced by the sample's path. Examples:
#   sync_cmd = rclone copy %f remote:infections/
#   sync_cmd = scp %f backup@10.0.0.9:/srv/infections/
# Leave unset to disable.
# sync_cmd =
