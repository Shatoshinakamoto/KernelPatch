# BiosGuard configuration.
#
# BiosGuard is DETECTION ONLY: it fingerprints the firmware (DMI identity +
# ACPI tables) at `baseline` and, at `scan`, logs CRITICAL and raises a
# notification on any change. It never writes, reflashes, or stages firmware.
#
# Detection uses /sys/class/dmi/id and /sys/firmware/acpi/tables
# automatically. Notifications are configured once, for all guards, in
# logging.conf (notify_cmd).
#
# baseline_trust: local  - trust the fingerprint stored on this host (default)
#                 signed - only trust it with a valid operator signature
#                          (fingerprint.sig, key in baseline-signing.pub;
#                          docs/ADDONS.md "Baseline trust")
# baseline_trust = local
