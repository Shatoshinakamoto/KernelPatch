# BiosGuard configuration.
#
# BiosGuard is DETECTION ONLY: it fingerprints the firmware (DMI identity +
# ACPI tables) at `baseline` and, at `scan`, logs CRITICAL and raises a
# notification on any change. It never writes, reflashes, or stages firmware.
#
# There are no knobs here yet - detection uses /sys/class/dmi/id and
# /sys/firmware/acpi/tables automatically. Notifications are configured once,
# for all guards, in logging.conf (notify_cmd). This file exists as the place
# for future BiosGuard options.
