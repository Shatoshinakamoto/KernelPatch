# BiosGuard (v8 add-on) configuration.
#
# Detection is always safe. Reflashing is operator-only and never automatic.
#
# flashrom binary + programmer used ONLY by `apply --i-understand-the-risk`.
flashrom = flashrom
programmer = internal
#
# Path to a verified known-good full flash image. If set, `baseline` stores it
# (compressed) as the restore source and `scan` can stage it on tamper. Without
# it, BiosGuard is detection-only. Obtain this image from a trusted dump of this
# exact board/firmware version (e.g. `flashrom -r good.bin` on a clean system).
# good_image = /etc/secure_sudo/addons/firmware/good.bin
