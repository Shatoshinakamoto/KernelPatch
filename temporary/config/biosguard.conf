# BiosGuard configuration.
#
# BiosGuard is DETECTION ONLY: it fingerprints the firmware (DMI identity +
# ACPI tables) at `baseline` and, at `scan`, logs CRITICAL and raises a
# notification on any change. It never writes, reflashes, or stages firmware.
#
# What it fingerprints (docs/BOOT_ASSURANCE.md "BiosGuard coverage and
# limits"): the DMI ids and ACPI tables always, plus the sources below when the
# host has them. `secure-sudo-biosguard status` shows what this host exposes.
# Notifications are configured once, for all guards, in logging.conf
# (notify_cmd). After a legitimate firmware or Secure Boot database update,
# run `secure-sudo-biosguard refresh <reason>`.
#
# smbios = 1       the raw SMBIOS table and entry point
# efi = 1          Secure Boot variables (SecureBoot, SetupMode, PK, KEK, db,
#                  dbx) and the UEFI update table (ESRT); a legacy-BIOS boot
#                  has neither
# tpm_pcrs = 0,2,7 TPM PCRs that measure firmware: 0 firmware code, 2 option
#                  ROMs, 7 Secure Boot policy. Empty = none. PCR 4 and up
#                  change with every bootloader or kernel update and 1 with
#                  firmware settings, so they are left out by default
# smbios = 1
# efi = 1
# tpm_pcrs = 0,2,7
#
# baseline_trust: local  - trust the fingerprint stored on this host (default)
#                 signed - only trust it with a valid operator signature
#                          (fingerprint.sig, key in baseline-signing.pub;
#                          docs/ADDONS.md "Baseline trust")
# baseline_trust = local
