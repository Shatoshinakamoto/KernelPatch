# BootGuard (v8 add-on) configuration.
#
# mode: enforce (stage a restore for next boot on tamper) or monitor (report).
mode = enforce

# Rotating backups: 1 = hourly-rotating backup buckets; 0 = a single fixed
# bucket (rotation OFF). The GUI can toggle this.
rotate = 1

# Boot directory to protect. Include the ESP too if it is mounted separately,
# by running a second baseline/scan with boot_dir pointed at it.
boot_dir = /boot

# Fallback backup root if Locus is not used (rotates hourly). Run
# `bootguard baseline` once to populate. The restore is applied at NEXT BOOT by
# secure-sudo-bootguard-restore.service, not live.
backup_root = /var/lib/secure_sudo/addons/bootguard/backups
