# secure-sudo-gui - local management console.
#
# ATTACK SURFACE: this console can edit config and quarantine/kill processes.
# Keep it on loopback. If you must reach it from elsewhere, do NOT widen bind -
# front it with your own authenticated TLS proxy and leave bind on 127.0.0.1.
#
# State-changing requests require the per-install token the server injects into
# the page (stored 0600 at /var/lib/secure_sudo/addons/gui/token); the server
# also checks the Host header. Run as root.

# mode: read_only (the default) shows everything and refuses every change;
#       admin also lets the console edit configs, set knobs, run scans and
#       baselines, and quarantine a process. Switch to admin only when you need
#       to change something, then back.
# mode = read_only

bind = 127.0.0.1
port = 8790
