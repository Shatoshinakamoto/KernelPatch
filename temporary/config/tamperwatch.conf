# tamperwatch - real-time tamper attribution for the PheonixBox protected set.
#
# mode: log       - only record WHICH process modified a protected file (default)
#       quarantine - also compress the offender's executable into quarantine and
#                    kill it. Opt-in; aggressive.
mode = log

# Rotating quarantine: 1 = hourly-rotating bucket, 0 = fixed bucket.
rotate = 1

# Fallback quarantine root when Locus is not used.
quarantine_root = /var/lib/secure_sudo/addons/tamperwatch/quarantine

# tamperwatch always watches the PheonixBox protected set
# (/etc/secure_sudo/pheonixbox.conf). Add any EXTRA absolute file/dir paths to
# watch here, one per line:
#/etc/ssh/sshd_config
