# secure_sudo temporary/ add-ons - shared logging configuration.
#
# Read by every add-on (ProcGuard, DriverGuard, BiosGuard, BootGuard, Locus)
# through the common ssaddon_log helper. All keys are optional; the defaults
# shown here are local-only logging with no off-box shipping.

# Where per-feature local logs are written (root-only, 0700). Each add-on
# writes <log_dir>/<feature>.log, rotated to <feature>.log.1 at the size cap.
log_dir = /var/log/secure_sudo/addons

# Rotate the local log once it passes this many bytes (default 8 MiB). The
# remote server, if configured, is the real long-term archive.
log_max_bytes = 8388608

# --- External log backup (off-box) -----------------------------------------
# Ship every log line to an external server so a compromised host cannot erase
# the record. Lines are sent as RFC 5424 syslog. Set remote_enabled = 1 and
# point it at your collector (rsyslog/syslog-ng, a SIEM, or a LAN log box).
remote_enabled = 0

# udp (fire-and-forget, classic syslog/514) or tcp (octet-framed, reliable).
remote_proto = udp

# Collector address. remote_host may be a hostname or IP.
remote_host =
remote_port = 514

# --- Notifications -----------------------------------------------------------
# Command run for notable events raised via ssl_notify() (e.g. a detected BIOS
# tamper). %m = message, %l = level, %f = feature (each safely single-quoted).
# Leave unset to disable. Examples:
#   notify_cmd = logger -t secure_sudo -p auth.crit %m
#   notify_cmd = wall "secure_sudo %f: %m"
#   notify_cmd = /usr/local/bin/notify-ops.sh %l %f %m
# notify_cmd =
