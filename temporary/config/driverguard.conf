# DriverGuard (v8 add-on) configuration.
#
# mode: monitor (report tamper only) or enforce (restore from backup on tamper).
mode = monitor

# Module tree to protect. Default (if unset) is /lib/modules/$(uname -r).
# driver_dir = /lib/modules/6.12.0

# Fallback backup root if Locus is not used; backups go into this hour's bucket
# under here (rotates hourly). Run `driverguard baseline` once to populate.
backup_root = /var/lib/secure_sudo/addons/driverguard/backups
