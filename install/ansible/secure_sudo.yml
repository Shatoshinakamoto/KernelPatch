#
# secure_sudo.yml - roll secure_sudo out to a fleet with Ansible.
#
# One host at a time by default: preflight, verified code, the kernel installed
# next to the running one, a trial boot, commit only after it came up, then
# policy and the daemon. The rollout stops at the first host that fails, so a
# bad build never reaches the rest of the fleet (NIST CM-3, CP-10).
# Everything the role does and every variable: docs/INSTALL.md (Ansible) and
# docs/configuration/ansible-vars.md. The kernel build itself stays in
# install/install.sh; the role runs its subcommands and never reimplements them.
#
# Usage (from this directory):
#   cp inventory.ini.example inventory.ini                  # list your hosts
#   cp group_vars/secure_sudo.yml.example group_vars/secure_sudo.yml   # optional
#   ansible-playbook -i inventory.ini secure_sudo.yml --check --diff   # dry run
#   ansible-playbook -i inventory.ini secure_sudo.yml
#   ansible-playbook -i inventory.ini secure_sudo.yml --limit web1 --tags config
#
# Needs: ansible-core 2.14 or later on the controller, SSH + sudo to the
# targets (become), Python 3 on the targets. Keep a console or second root
# session per host for the first rollout (docs/RECOVERY.md).
- name: Install and configure secure_sudo
  hosts: secure_sudo
  become: true
  gather_facts: true
  # SECURITY: roll out one host at a time and stop the whole run at the first
  # failure, so a broken kernel reaches one machine, not the fleet.
  serial: "{{ secure_sudo_serial | default(1) }}"
  max_fail_percentage: 0
  roles:
    - role: secure_sudo
